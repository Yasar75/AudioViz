name: Build LumenLink Android APK
on:
  push:
    branches:
      - lumenlink-apk-build-20261122
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore original LumenLink Flutter sources
        run: |
          mkdir -p /tmp/lumenlink-build
          python3 - <<'PY'
          import base64, lzma, tarfile, io, pathlib, hashlib
          parts = pathlib.Path("lumenlink_parts")
          s = ''.join((parts / f'{i:02d}').read_text() for i in range(5))
          digest = hashlib.sha256(s.encode()).hexdigest()
          print('Build source SHA256:', digest)
          assert digest == '65f0e15a36f4e9e556deedd32f5a21c67211182e9a5e4f219e4207d4b8b987c9', 'source checksum mismatch'
          data = lzma.decompress(base64.b64decode(s))
          with tarfile.open(fileobj=io.BytesIO(data)) as t:
            t.extractall('/tmp/lumenlink-build',filter='data')
          PY
      - name: Apply pairing fix
        run: |
          python3 -m pip install --quiet brotli
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          p=pathlib.Path('/tmp/lumenlink-build/lib/ui/setup.dart')
          blob=base64.b64decode(pathlib.Path('lumenlink_patch/setup.dart.br.b64').read_text())
          data=brotli.decompress(blob)
          assert hashlib.sha256(data).hexdigest() == '1459b759a581420820ad9425c61f6c16d380f6f06bc0e7c3ad0592ec32b054a4', 'Patch checksum mismatch'
          p.write_bytes(data)
          print('Applied improved device discovery and provisioning diagnostics')
          PY
          sed -i 's/version: 0.1.0+1/version: 0.1.1+2/' /tmp/lumenlink-build/pubspec.yaml
      - name: WLED-first pairing and Android 17 local-network access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/lumenlink-build/lib/ui/setup.dart')
          s = p.read_text()
          assert 'Try common WLED / LumenLink addresses' in s
          s = s.replace("final _host = TextEditingController();", "final _host = TextEditingController(text: '192.168.0.9');")
          s = s.replace("final _name = TextEditingController(text: 'My LED Strip');", "final _name = TextEditingController(text: 'RoomPixel');")
          s = s.replace("setState(() { loading = true; message = null; });", "setState(() { loading = true; message = null; configured = false; });")
          s = s.replace("appBar: AppBar(title: const Text('Set up your lights'),", "appBar: AppBar(title: const Text('WLED Setup  ·  v0.1.2'),")
          s = s.replace("const _SectionLabel('Connect to an existing WLED or LumenLink controller'),", "const _SectionLabel('Connect existing WLED over Wi-Fi'),")
          s = s.replace("label: const Text('Connect & add device')", "label: const Text('Connect RoomPixel WLED')")
          s = s.replace("const Text('First-time ESP32 setup', style: TextStyle(fontWeight: FontWeight.bold)),", "const Text('Custom LumenLink firmware only (not WLED)', style: TextStyle(fontWeight: FontWeight.bold)),")
          s = s.replace("label: Text(showProvisioning ? 'Hide LumenLink provisioning' : 'Set up LumenLink Wi-Fi')", "label: Text(showProvisioning ? 'Hide custom firmware setup' : 'Set up custom LumenLink firmware only')")
          s = s.replace("  Future<void> _probe() => _work(() async {", """  Future<void> _testWled() => _work(() async {
            final address = _host.text.trim();
            if (address.isEmpty) throw StateError('Enter the WLED IP or hostname first.');
            final info = await widget.store.service.get(address, '/json/info');
            final leds = info['leds'] is Map ? (info['leds'] as Map)['count'] : null;
            if (mounted) setState(() {
              configured = true;
              message = 'WLED API connected: version ' + (info['ver'] ?? 'unknown').toString() +
                ', LEDs: ' + (leds ?? '?').toString() + '. Tap Connect RoomPixel WLED.';
            });
          });
          Future<void> _probe() => _work(() async {""")
          s = s.replace("          const SizedBox(height: 10),\n          OutlinedButton.icon(onPressed: loading ? null : _findController,", """          const SizedBox(height: 10),
          OutlinedButton.icon(onPressed: loading ? null : _testWled,
            icon: const Icon(Icons.fact_check_outlined),
            label: const Text('Test WLED JSON connection')),
          const SizedBox(height: 10),
          OutlinedButton.icon(onPressed: loading ? null : _findController,""")
          s = s.replace("return 'The ESP32 did not respond. Check that it is powered on, has WLED or LumenLink '", "return 'LumenLink cannot reach the controller over the local network. On Android 17, allow LumenLink Nearby devices / Local network in Android Settings > Apps > LumenLink > Permissions. Verify http://192.168.0.9/json/info in Chrome. Check that the ESP32 is powered on, has WLED or LumenLink '")
          p.write_text(s)
          pp=Path('/tmp/lumenlink-build/pubspec.yaml')
          pp.write_text(pp.read_text().replace('version: 0.1.1+2', 'version: 0.1.2+3'))
          print('WLED UI v0.1.2 applied with local-network runtime permission.')
          PY
      - name: Generate Android platform
        working-directory: /tmp/lumenlink-build
        run: |
          flutter create --empty --platforms=android --project-name lumenlink --org dev.lumenlink .
          cp android_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/dev/lumenlink/lumenlink
          cp android_template/kotlin/dev/lumenlink/lumenlink/MainActivity.kt android/app/src/main/kotlin/dev/lumenlink/lumenlink/MainActivity.kt
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 37/' android/app/build.gradle.kts
      - name: Install Android API 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' || true
      - name: Fetch dependencies
        working-directory: /tmp/lumenlink-build
        run: flutter pub get
      - name: Analyze
        working-directory: /tmp/lumenlink-build
        run: flutter analyze --no-fatal-infos
      - name: Build installable debug APK
        working-directory: /tmp/lumenlink-build
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumenLink-Android-APK
          path: /tmp/lumenlink-build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
