name: Build LumenLink Android APK
on:
  push:
    branches:
      - lumenlink-apk-build-20261122
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore original LumenLink Flutter sources
        run: |
          mkdir -p /tmp/lumenlink-build
          python3 - <<'PY'
          import base64, lzma, tarfile, io, pathlib, hashlib
          parts = pathlib.Path("lumenlink_parts")
          s = ''.join((parts / f'{i:02d}').read_text() for i in range(5))
          digest = hashlib.sha256(s.encode()).hexdigest()
          print('Build source SHA256:', digest)
          assert digest == '65f0e15a36f4e9e556deedd32f5a21c67211182e9a5e4f219e4207d4b8b987c9', 'source checksum mismatch'
          data = lzma.decompress(base64.b64decode(s))
          with tarfile.open(fileobj=io.BytesIO(data)) as t:
            t.extractall('/tmp/lumenlink-build',filter='data')
          PY
      - name: Apply pairing fix
        run: |
          python3 -m pip install --quiet brotli
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          p=pathlib.Path('/tmp/lumenlink-build/lib/ui/setup.dart')
          blob=base64.b64decode(pathlib.Path('lumenlink_patch/setup.dart.br.b64').read_text())
          data=brotli.decompress(blob)
          assert hashlib.sha256(data).hexdigest() == '1459b759a581420820ad9425c61f6c16d380f6f06bc0e7c3ad0592ec32b054a4', 'Patch checksum mismatch'
          p.write_bytes(data)
          print('Applied improved device discovery and provisioning diagnostics')
          PY
          sed -i 's/version: 0.1.0+1/version: 0.1.1+2/' /tmp/lumenlink-build/pubspec.yaml
      - name: Apply universal branding and legal documents
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,base64,lzma,tarfile,io
          p=pathlib.Path('lumenlink_v020')
          b64=''.join((p/f'{i:02d}').read_text() for i in range(4))
          assert hashlib.sha256(b64.encode()).hexdigest() == '5bdf6da16049743877ca2bd02518e3f0ef6b7fe782a07449f797d257f62d2d52', 'overlay checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(b64)))) as tf:
            tf.extractall('/tmp/lumenlink-build',filter='data')
          PY
          sed -i 's/version: 0.1.1+2/version: 0.1.0+1/' /tmp/lumenlink-build/pubspec.yaml
          patch -p1 -d /tmp/lumenlink-build -i /tmp/lumenlink-build/update.patch
          grep -q 'version: 0.2.0+4' /tmp/lumenlink-build/pubspec.yaml
          grep -q 'LumenBrand' /tmp/lumenlink-build/lib/ui/home.dart
          if grep -RniE '192\\.168\\.0\\.9|RoomPixel' /tmp/lumenlink-build/lib; then
            echo 'ERROR: personal controller details must not be included'; exit 1
          fi
      - name: Apply LumenLink v0.2.1 UI and launcher icon
        run: |
          mkdir -p /tmp/lumenlink-v021
          python3 - <<'PY'
          import pathlib,base64,lzma,tarfile,io,hashlib
          root=pathlib.Path('lumenlink_v021')
          b64=''.join((root/f'{i:02d}').read_text() for i in range(2))
          digest=hashlib.sha256(b64.encode()).hexdigest()
          print('v0.2.1 patch checksum:',digest)
          assert digest == 'ddcda612a32126734b1838f366df1d923a3b6053ef56f92779dbec643cccb0e0', 'patch checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(b64)))) as tar:
            tar.extractall('/tmp/lumenlink-v021',filter='data')
          PY
          patch --batch -p1 -d /tmp/lumenlink-build -i /tmp/lumenlink-v021/v021.patch
          cp /tmp/lumenlink-v021/lumenlink_icon.webp /tmp/lumenlink-build/assets/lumenlink_icon.webp
          grep -q 'version: 0.2.1+5' /tmp/lumenlink-build/pubspec.yaml
          grep -q 'Choose a controller' /tmp/lumenlink-build/lib/ui/home.dart
          grep -q '“by Yash”' /tmp/lumenlink-build/lib/ui/brand.dart
          ! grep -R -E '192\\.168\\.0\\.9|RoomPixel' /tmp/lumenlink-build/lib
      - name: Apply LumenLink v0.2.3 optional account integration
        run: |
          mkdir -p /tmp/lumenlink-v023
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,tarfile,io,hashlib
          b64=''.join((Path('lumenlink_v023')/f'{i:02d}').read_text() for i in range(2))
          digest=hashlib.sha256(b64.encode()).hexdigest()
          print('Account UI bundle SHA256:',digest)
          assert digest=='64a3c28e87966127c3787fb8369908e5893776d28b3b6b9f999225405ddfb081', 'Incorrect account overlay checksum'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(b64)))) as archive:
            archive.extractall('/tmp/lumenlink-v023',filter='data')
          PY
          patch --batch -p1 -d /tmp/lumenlink-build -i /tmp/lumenlink-v023/v023.patch
          mkdir -p /tmp/lumenlink-build/test
          cp /tmp/lumenlink-v023/account.dart /tmp/lumenlink-build/lib/ui/account.dart
          cp /tmp/lumenlink-v023/account_entry_test.dart /tmp/lumenlink-build/test/account_entry_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/lumenlink-build/test/account_entry_test.dart')
          s=p.read_text().replace("find.text('LumenLink account')", "find.text('Account & connected services')")
          s=s.replace("expect(find.text(method), findsOneWidget);",
            "await tester.scrollUntilVisible(find.text(method), 240.0);\n    expect(find.text(method), findsOneWidget);")
          p.write_text(s)
          PY
          cp /tmp/lumenlink-v023/ACCOUNT_INTEGRATION.md /tmp/lumenlink-build/ACCOUNT_INTEGRATION.md
          sed -i "/^import 'dart:async';$/d" /tmp/lumenlink-build/lib/ui/account.dart
          grep -q 'version: 0.2.3+7' /tmp/lumenlink-build/pubspec.yaml
          grep -q 'Continue using local lights without an account' /tmp/lumenlink-build/lib/ui/account.dart
          grep -q 'Choose a controller' /tmp/lumenlink-build/lib/ui/home.dart
          ! grep -R -E '192\\.168\\.0\\.9|RoomPixel' /tmp/lumenlink-build/lib
      - name: Apply v0.2.4 account-first onboarding, guest access and settings fixes
        run: |
          mkdir -p /tmp/lumenlink-v024
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,tarfile,io,hashlib
          b64=''.join((Path('lumenlink_v024')/f'{i:02d}').read_text() for i in range(2))
          digest=hashlib.sha256(b64.encode()).hexdigest()
          print('v0.2.4 bundle SHA256:',digest)
          assert digest == '427761daeb31170361f04df435e24cad1583c0c47590f52e8bdfc7a2a3f4261e'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(b64)))) as tf:
            tf.extractall('/tmp/lumenlink-v024',filter='data')
          PY
          cp /tmp/lumenlink-v023/account_entry_test.dart /tmp/lumenlink-build/test/account_entry_test.dart
          patch --batch -p1 -d /tmp/lumenlink-build -i /tmp/lumenlink-v024/update.patch
          cp /tmp/lumenlink-v024/welcome.dart /tmp/lumenlink-build/lib/ui/welcome.dart
          cp /tmp/lumenlink-v024/welcome_flow_test.dart /tmp/lumenlink-build/test/welcome_flow_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/lumenlink-build/test/welcome_flow_test.dart')
          s=p.read_text()
          old="await tester.ensureVisible(find.text('Continue as guest'));"
          assert old in s
          s=s.replace(old,"await tester.scrollUntilVisible(find.text('Continue as guest'), 250.0);")
          s=s.replace("find.text('Cloud features require a LumenLink account:')", "find.text('These cloud features require a LumenLink account:')")
          p.write_text(s)
          PY
          grep -q 'version: 0.2.4+8' /tmp/lumenlink-build/pubspec.yaml
          grep -q 'WelcomeScreen(store: store)' /tmp/lumenlink-build/lib/main.dart
          grep -q 'Guest · Local controls only' /tmp/lumenlink-build/lib/ui/home.dart
          grep -q 'Continue as guest' /tmp/lumenlink-build/lib/ui/welcome.dart
      - name: Generate Android platform
        working-directory: /tmp/lumenlink-build
        run: |
          flutter create --empty --platforms=android --project-name lumenlink --org dev.lumenlink .
          cp android_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/dev/lumenlink/lumenlink
          cp android_template/kotlin/dev/lumenlink/lumenlink/MainActivity.kt android/app/src/main/kotlin/dev/lumenlink/lumenlink/MainActivity.kt
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 37/' android/app/build.gradle.kts
      - name: Generate unique LumenLink launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('/tmp/lumenlink-build')
          icon=Image.open(root/'assets/lumenlink_icon.webp').convert('RGBA')
          base=root/'android/app/src/main/res'
          for density,side in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
            target=base/f'mipmap-{density}'
            target.mkdir(exist_ok=True,parents=True)
            icon.resize((side,side),Image.Resampling.LANCZOS).save(target/'ic_launcher.png',format='PNG')
          print('Custom LumenLink Android launcher artwork installed')
          PY
      - name: Install Android API 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' || true
      - name: Fetch dependencies
        working-directory: /tmp/lumenlink-build
        run: flutter pub get
      - name: Remove obsolete header variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/lumenlink-build/lib/ui/home.dart')
          s=p.read_text()
          assert '    final skin = skins[s.skinIndex];' in s
          p.write_text(s.replace('    final skin = skins[s.skinIndex];', ''))
          PY
      - name: Analyze
        working-directory: /tmp/lumenlink-build
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter widget and model tests
        working-directory: /tmp/lumenlink-build
        run: flutter test
      - name: Build installable debug APK
        working-directory: /tmp/lumenlink-build
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumenLink-Android-APK
          path: /tmp/lumenlink-build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
